name: benchmark
on:
  push:
    branches: [main]
  pull_request:

jobs:
  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6
        with:
          go-version: "1.25"

      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v5

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest

      - name: Run benchmarks
        run: |
          go test -tags sqlite -bench=. -count=6 -benchmem ./localserver/ -run='^$' > bench.txt 2>&1

      - name: Format results
        run: |
          grep -E '^(goos|goarch|pkg|cpu|Benchmark.*/Memory)' bench.txt | sed 's|/Memory||' > Memory.txt
          grep -E '^(goos|goarch|pkg|cpu|Benchmark.*/SQLite)' bench.txt | sed 's|/SQLite||' > SQLite.txt

          {
            echo '## Benchmark Results (localserver: Memory vs SQLite)'
            echo ''
            echo 'HTTP request throughput via httptest. Single client, sequential requests.'
            echo ''
            echo '| Benchmark | Description |'
            echo '|-----------|-------------|'
            echo '| Send | POST a message |'
            echo '| SendReceiveDelete | POST + GET + DELETE a message |'
            echo '| ReceiveEmpty | GET from an empty queue |'
            echo ''
            echo '```'
            benchstat Memory.txt SQLite.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
